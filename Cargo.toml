[package]
name = "JASS-Tree-sitter-Rust"
version = "0.2.0"
authors = ["nazarpunk <nazarpunk@gmail.com>"]
repository = "https://github.com/WarRaft/JASS-Tree-sitter-rust"
edition = "2024"

[dependencies]
tree-sitter = "0.25.8"
#tree-sitter-lua = { path = "./../tree-sitter-lua" }
tree-sitter-bni = { path = "./../tree-sitter-bni" }
strum = "0.27.2"
strum_macros = "0.27.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_repr = "0.1.20"
tokio = { version = "1.47.1", features = ["full"] }
env_logger = "0.11.8"
ropey = "1.6.1"
log = "0.4.27"
url = { version = "2.5.4", features = ["serde"] }
once_cell = "1.21.3"
num_enum = "0.7.4"
async-trait = "0.1.88"

[build-dependencies]


