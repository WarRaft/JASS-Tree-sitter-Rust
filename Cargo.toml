[package]
name = "JASS-Tree-sitter-Rust"
version = "0.1.0"
authors = ["nazarpunk <nazarpunk@gmail.com>"]
repository = "https://github.com/WarRaft/JASS-Tree-sitter-rust"
edition = "2024"

[dependencies]
base64 = "0.22.1"
blp = "0.1.32"
tree-sitter = "0.25.10"
tree-sitter-bni = { path = "./../tree-sitter-bni" }
strum = "0.27.2"
strum_macros = "0.27.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
tokio = { version = "1.48.0", features = ["full"] }
env_logger = "0.11.8"
image = "0.25.6"
lapce-xi-rope = "0.3.2"
log = "0.4.28"
url = { version = "2.5.7", features = ["serde"] }
once_cell = "1.21.3"
num_enum = "0.7.5"
async-trait = "0.1.89"
dashmap = "7.0.0-rc2"
